name: 시험

# PR마다 백엔드 · 화면 시험을 돌린다(2026-11-19). 자동 병합(auto-merge-collaborator.yml)은 이 시험이 통과한 커밋만 병합한다.
# DB · data/ 없이 돈다: 백엔드 시험 중 DB나 PC 자료가 필요한 것(표시 db · local_data, conftest.py)은 빼고
# 계산 · API 형식 · 화면 동작을 본다. 뺀 시험은 지금처럼 PC의 컨테이너에서 돌린다(docs/TEAM_SETUP.md).
#
# 안전: pull_request라 PR의 코드를 읽기 권한만으로 돌린다. 비밀값 · 쓰기 권한을 쓰지 않는다.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 시험
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'          # backend/Dockerfile과 같은 판
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 설치
        run: pip install -r backend/requirements.txt
      - name: 시험
        working-directory: backend
        env:
          # DB가 없음: 연결 시도(conftest의 정리 단계)가 바로 끝나게 짧은 제한을 둔다
          DATABASE_URL: postgresql+psycopg://127.0.0.1:5432/ci?connect_timeout=3
        run: python -m pytest -q -rs -p no:cacheprovider -m "not db and not local_data"

  frontend:
    name: 화면 시험
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 설치
        run: npm ci --no-audit --no-fund
      - name: 형식 검사 · 빌드
        run: npm run build
      - name: 시험
        run: npm test
