name: carbon-urban-dss
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: carbon
      POSTGRES_USER: carbon
      POSTGRES_PASSWORD: carbon_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 2026-11-24: 첫 지역 조회 때 DB 파일 캐시가 이 컨테이너 몫으로 21 GB까지 쌓였다(프로세스 자체는 공유 버퍼 128 MB).
    # 한도를 걸면 캐시만 줄어든다(꺼지지 않음). 작업 중 VM 파일 캐시의 대부분(3.4 GB 중 2.9 GB)이 이 컨테이너 몫.
    # 2 GB는 3 GB와 첫 조회 시간 차이가 측정 오차 안, 1.5 GB부터 큰 지도가 3~5초 느려짐(docs/records/2026-11-24-wsl-dropcache.md)
    mem_limit: 2g
    healthcheck:
      test: [CMD-SHELL, pg_isready -U carbon -d carbon]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://carbon:carbon_local@postgres:5432/carbon
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      OLLAMA_URL: http://ollama:11434
      TEAM_MODEL_URL: http://team-model:8090
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_NARRATIVE_MODEL: ${OLLAMA_NARRATIVE_MODEL:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 30
  worker:
    build: ./backend
    env_file: .env
    environment: *backend_env
    # 5 = 지역 수집 차선 4개(기본 · K-apt · VWorld · 건축HUB, 2026-11-21) + 다른 작업 1개
    # --max-tasks-per-child (2026-11-24): 작업 50개마다 프로세스를 새로 띄워, 한 번 커진 메모리(관측 434 · 314 MB)를 놓게 함
    command: celery -A app.tasks.celery_app worker --loglevel=WARNING --concurrency=5 --max-tasks-per-child=50
    volumes:
      - ./data:/data
    depends_on:
      api: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api: {condition: service_healthy}
  ollama:
    image: ollama/ollama:0.11.10
    profiles: [local-ai]
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 4g
  # 팀 변화 모델(urban-carbon 7차): 팀 인계 묶음이 있는 PC에서만 켠다(--profile team-model). 묶음은 읽기만 한다.
  team-model:
    build: ./deploy/team-model
    profiles: [team-model]
    environment:
      TEAM_ROOT: /team-root
      TEAM_TRAIN: 00_합본_7차
    volumes:
      - ./data/raw/team_urban_carbon:/team-root:ro
    mem_limit: 6g
volumes:
  ollama_data:
  postgres_data:
  redis_data:
